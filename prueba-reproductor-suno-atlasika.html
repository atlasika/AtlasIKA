<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba reproductor Suno — AtlasIKA</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px; background: #111318; color: #f4f4f5;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #c4c7ce; }
    .player {
      width: 100%; height: 220px; border: 1px solid #343943;
      border-radius: 14px; overflow: hidden; background: #191c23;
    }
    iframe { display: block; width: 100%; height: 220px; border: 0; }
    a { color: #9ec5ff; }
    .note { font-size: .9rem; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Prueba del reproductor oficial de Suno</h1>
    <p>Canción: Donde mueren las palabras — AtlasIKA</p>
    <div class="player">
      <iframe
        src="https://suno.com/embed/8f7e6f0e-0365-4183-af22-e0e4454fb345"
        title="Donde mueren las palabras — Suno"
        loading="eager"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>
    <p class="note">
      Si el reproductor aparece, pulsa Play y comprueba que la canción suena.
      <a href="https://suno.com/song/8f7e6f0e-0365-4183-af22-e0e4454fb345" target="_blank" rel="noopener noreferrer">Abrir canción directamente en Suno</a>.
    </p>
    <p class="note">Esta es una prueba aislada. No modifica index.html, Supabase ni las canciones de AtlasIKA.</p>
  </main>
</body>
</html>
